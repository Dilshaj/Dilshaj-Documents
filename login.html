<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In | Dilshaj Infotech HR Suite</title>

  <!-- Auth Guard -->
  <script src="auth.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Shared Design System -->
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-color, #dde4ee);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-bright, #0f172a);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
    }

    .login-card {
      background: var(--panel-card-bg, #ffffff);
      border: 1px solid var(--border-color, #cbd7e4);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .brand-logo-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }

    .brand-logo-container img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-bright, #0f172a);
      margin: 0 0 6px 0;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-dim, #64748b);
      margin: 0 0 28px 0;
      line-height: 1.4;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted, #334155);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 12px 42px 12px 14px;
      font-size: 0.9375rem;
      font-family: inherit;
      border: 1px solid var(--border-color, #cbd7e4);
      border-radius: 8px;
      background: var(--input-bg, #ffffff);
      color: var(--text-bright, #0f172a);
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus {
      border-color: var(--accent-primary, #1d6bf3);
      box-shadow: 0 0 0 3px var(--accent-subtle, rgba(29, 107, 243, 0.15));
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim, #64748b);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .toggle-password:hover {
      color: var(--accent-primary, #1d6bf3);
    }

    .login-btn {
      width: 100%;
      padding: 12px 20px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      color: #ffffff;
      background: var(--accent-gradient, linear-gradient(180deg, #1d6bf3 0%, #1557c0 100%));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(29, 107, 243, 0.25);
      transition: opacity 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.4;
    }

    .login-footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-dim, #64748b);
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .badge-passcode {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 10px;
      background: rgba(29, 107, 243, 0.08);
      color: var(--accent-primary, #1d6bf3);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo-container">
        <img src="Logo.png" alt="Dilshaj Infotech Logo">
      </div>

      <h1 class="login-title">HR Document Portal</h1>
      <p class="login-subtitle">Enter your Admin or Preview passcode to sign in to the portal.</p>

      <div id="errorAlert" class="error-alert"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="passcodeInput">Passcode</label>
          <div class="input-wrapper">
            <input type="password" id="passcodeInput" class="input-field" placeholder="Enter authorization passcode"
              required autofocus>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()"
              title="Toggle visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="login-btn">
          <span>Sign In to Portal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer">
        <span>&copy; Dilshaj Infotech Private Limited. All rights reserved.</span>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('passcodeInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        input.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('passcodeInput');
      const submitBtn = document.getElementById('submitBtn');
      const errorAlert = document.getElementById('errorAlert');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Authenticating...';

      const res = await window.PortalAuth.login(input.value);

      if (res.success) {
        window.location.href = 'index.html';
      } else {
        errorAlert.textContent = res.message || 'Invalid passcode.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Sign In to Portal';
        input.focus();
        input.select();
      }
    }
  </script>
</body>

</html>
